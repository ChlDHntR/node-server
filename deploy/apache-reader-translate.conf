# Apache reverse proxy for the Reader-translate backend.
# Frontend is served separately (CloudFront); this vhost only fronts the Node
# API container, published on 127.0.0.1:3000 (host) -> 3003 (container).
#
# Install (Ubuntu/Debian):
#   sudo a2enmod proxy proxy_http
#   sudo cp deploy/apache-reader-translate.conf /etc/apache2/sites-available/reader-translate.conf
#   sudo a2ensite reader-translate
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then obtain TLS (certbot matches -d against ServerName below):
#   sudo certbot --apache -d api.reader.chdmlstr-personal.org
# certbot adds a :443 vhost + HTTP->HTTPS redirect and sets up auto-renewal.

<VirtualHost *:80>
    ServerName api.reader.chdmlstr-personal.org

    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:3000/
    ProxyPassReverse /  http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/reader-translate-error.log
    CustomLog ${APACHE_LOG_DIR}/reader-translate-access.log combined
</VirtualHost>
