# Apache reverse proxy for the Reader-translate backend.
# Frontend is served separately (CloudFront); this host only fronts the Node
# API container running on 127.0.0.1:3003.
#
# Install (Ubuntu/Debian):
#   sudo a2enmod proxy proxy_http
#   sudo cp deploy/apache-reader-translate.conf /etc/apache2/sites-available/reader-translate.conf
#   sudo a2ensite reader-translate
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# For HTTPS (recommended — CloudFront is HTTPS, so an HTTP API triggers
# mixed-content blocking in the browser), run certbot after this is working:
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d api.your-domain.com
# certbot rewrites this into a :443 vhost and adds an HTTP->HTTPS redirect.

<VirtualHost *:80>
    ServerName api.your-domain-or-ec2-public-ip

    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:3003/
    ProxyPassReverse /  http://127.0.0.1:3003/

    ErrorLog  ${APACHE_LOG_DIR}/reader-translate-error.log
    CustomLog ${APACHE_LOG_DIR}/reader-translate-access.log combined
</VirtualHost>
