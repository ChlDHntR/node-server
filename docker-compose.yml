services:
  backend:
    build: .
    image: reader-translate-api
    container_name: reader-translate-api
    restart: unless-stopped
    # Reads ANTHROPIC_API_KEY (and optionally PORT) from .env on the host.
    # This file is NOT copied into the image — it stays on the EC2 host.
    env_file:
      - .env
    # Bound to loopback only — Apache on the host reverse-proxies to it.
    # host 3000 -> container 3003, so the existing Apache proxy (which points
    # at 127.0.0.1:3000) needs no change. Nothing reaches the container
    # except through Apache (80/443).
    ports:
      - "127.0.0.1:3000:3003"
